[package]
name = "nodus-ui"
version = "0.1.0"
description = "The marks both paint: the frame, the rail and the pieces a page composes"
edition = "2024"

[dependencies]
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0", default-features = false }
# The same capability value the SDK negotiates: the gate here must read one answer, not a
# second list that can disagree with it.
nodus-protocol = { path = "../../../sdk/crates/nodus", version = "0.1.0" }
leptos = { version = "0.8", default-features = false }
icondata = { version = "0.5", default-features = false, features = ["lucide"] }
blurhash = "0.2.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lol_html = "2"
serde = { workspace = true }
serde_json = { workspace = true }


[lints]
workspace = true

[dev-dependencies]
leptos = { version = "0.8", default-features = false, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "HtmlHeadElement",
    "HtmlElement",
    # The motion preference the pictures follow is a media query, read where a browser is.
    "MediaQueryList",
    "Response",
    "Window",
] }
gloo-net = { version = "0.6", features = ["http"] }
